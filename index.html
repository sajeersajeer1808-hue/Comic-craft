<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ComicCraft - Create Your Comic</title>
<style>
  * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.25)),
      url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1600') center/cover no-repeat;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { background: #fff; width: 420px; max-width: 95vw; border-radius: 12px;
    padding: 26px 26px 22px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  h2 { text-align: center; margin: 0 0 16px; }
  label { font-size: 12px; font-weight: bold; display: block; margin: 12px 0 4px; }
  textarea, input, select {
    width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1;
    border-radius: 6px; font-size: 14px; background: #f1f8ff;
  }
  button {
    width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 6px;
    background: #1668dc; color: #fff; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #0f53b8; }
  .hint { font-size: 12px; color: #666; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
  <form class="card" action="/generate" method="post">
    <h2>🖊️ Create Your Comic</h2>
    <label>Story Prompt:</label>
    <textarea name="prompt" rows="3" required>A brave fox explores an enchanted forest.</textarea>
    <label>Main Character Name:</label>
    <input name="character_name" value="Free" required />
    <label>Setting:</label>
    <select name="setting">
      <option>forest</option><option>school</option>
      <option>space</option><option>city</option>
    </select>
    <label>Story Tone:</label>
    <select name="tone">
      <option>dramatic</option><option>light-hearted</option>
      <option>poetic</option><option>funny</option>
    </select>
    <label>Art Style:</label>
    <select name="style">
      <option>realistic</option><option>anime</option>
      <option>pixel art</option><option>comic book</option>
    </select>
    <button type="submit">Generate Comic</button>
    <div class="hint">Powered by Gemini + Stable Diffusion • demo mode works without API keys</div>
  </form>
</body>
</html>
