<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Export Success - ComicCraft</title>
<style>
  body { margin: 0; background: #eef1f4; font-family: Arial, Helvetica, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .box { background: #fff; border-radius: 12px; padding: 40px; text-align: center;
    max-width: 560px; box-shadow: 0 8px 30px rgba(0,0,0,.1); }
  h1 { color: #22a06b; }
  .btn { display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 8px;
    background: #1668dc; color: #fff; text-decoration: none; font-weight: bold; }
  .btn:hover { background: #0f53b8; }
  code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="box">
  <h1>✅ Comic Exported Successfully!</h1>
  <p>Your AI-powered comic has been successfully created! Dive back in and bring another story to life.</p>
  {% if pdf_path %}
  <p>Saved at <code>{{ pdf_path }}</code> — <a href="{{ pdf_path }}" download>download again</a></p>
  {% endif %}
  <a class="btn" href="/">🎨 Go Create Another Comic</a>
</div>
</body>
</html>
